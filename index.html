<!DOCTYPE html>
<html lang="nb">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14160f">
  <meta name="description" content="Enkel stemmer for akustisk gitar. Standardstemming E A D G B E.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <title>Gitarstemmer</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="css/tuner.css">
</head>
<body>
  <main class="app is-idle" id="app">
    <header class="top">
      <h1>Gitarstemmer</h1>
      <p class="tag">Akustisk gitar · standardstemming</p>
    </header>

    <section class="stage">
      <div class="readout">
        <p class="note-wrap">
          <span class="note" id="note" translate="no">–</span><sup class="octave" id="octave" translate="no" hidden></sup>
        </p>
        <p class="which" id="which"></p>
        <p class="cents" id="cents">&nbsp;</p>
      </div>

      <div
        class="meter"
        id="meter"
        role="meter"
        aria-valuemin="-50"
        aria-valuemax="50"
        aria-valuenow="0"
        aria-label="Avvik i cent"
      >
        <div class="meter-labels" aria-hidden="true">
          <span id="label-flat">for lavt</span>
          <span id="label-sharp">for høyt</span>
        </div>
        <div class="track-wrap">
          <div class="track">
            <div class="zone"></div>
            <div class="tick"></div>
          </div>
          <div class="needle" id="needle"></div>
        </div>
        <p class="status" id="status">Trykk Start og spill strengene.</p>
      </div>
    </section>

    <div class="strings" id="strings" role="group" aria-label="Strenger" translate="no"></div>
    <p class="hint" id="hint" hidden></p>
    <p class="message" id="message" hidden></p>

    <div class="actions">
      <div class="secondary">
        <button type="button" class="mini" id="tone" aria-pressed="false">Referansetone</button>
        <button type="button" class="mini" id="lock" aria-pressed="false">Lås streng</button>
      </div>
      <button type="button" class="start" id="start" aria-pressed="false">Start</button>
    </div>
  </main>
  <p class="live" id="live" aria-live="polite"></p>
  <noscript>Gitarstemmeren trenger JavaScript og mikrofon.</noscript>
  <script src="js/pitch.js"></script>
  <script src="js/tuner.js"></script>
</body>
</html>
